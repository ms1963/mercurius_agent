[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mercurius-agent"
version = "2.0.0"
description = "Mercury: Autonomous Enterprise Agentic AI System with Jev Decisions, MCP, and 5-Tier Memory"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Mercurius Team" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence"
]

[project.scripts]
mercurius = "mercury.ui.cli:main"
mercury-server = "mercury.ui.server:run_server"
